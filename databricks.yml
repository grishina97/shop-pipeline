# Databricks Asset Bundle: Lakeflow bronze pipeline, the shop_daily orchestration job
# (pipeline -> dbt -> dashboard refresh) and the Shop Revenue AI/BI dashboard.
bundle:
  name: shop_pipeline

include:
  - resources/*.yml

sync:
  exclude:                     # upload only what runs in the workspace: Lakeflow code and the dbt project
    - sample_data/**
    - docs/**
    - pipeline/shop-pipeline/dashboards/**   # deployed as a dashboard resource; syncing it would create a stray copy

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: workspace
  schema:
    description: Schema the Lakeflow pipeline writes bronze tables to
  dbt_schema:
    description: dbt target schema; models land in <dbt_schema>_staging, _intermediate, _marts
  warehouse_id:
    description: SQL warehouse for the dbt task and the dashboard
    default: a201bb41d987c4b2   # Serverless Starter Warehouse
  raw_files_path:
    description: Volume folder that generate_orders writes synthetic order CSVs to and Auto Loader reads from
    default: /Volumes/workspace/shop/raw_files

targets:
  dev:
    mode: development          # names prefixed "[dev <user>]", schedules paused, pipeline in development mode
    default: true
    workspace:
      host: https://dbc-e20a4581-d807.cloud.databricks.com
    variables:
      schema: shop             # dev mode prefixes the schema resource -> dev_<user>_shop, never the prod schema
      dbt_schema: dev_${workspace.current_user.short_name}_shop   # -> dev_<user>_shop_staging/_intermediate/_marts
      # personal dev volume, so generated test files never land in the prod volume
      raw_files_path: /Volumes/${var.catalog}/${resources.schemas.shop_dev.name}/${resources.volumes.raw_files_dev.name}
    resources:
      schemas:
        shop_dev:
          catalog_name: ${var.catalog}
          name: ${var.schema}
          comment: Personal dev schema for the shop bronze pipeline (bundle dev target)
      volumes:
        raw_files_dev:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.shop_dev.name}
          name: raw_files
          comment: Personal dev volume for synthetic order CSVs (bundle dev target)
      pipelines:
        shop_pipeline:
          schema: ${resources.schemas.shop_dev.name}   # resolves to the prefixed dev schema, created before the pipeline
          configuration:
            shop.raw_files_path: ${var.raw_files_path}   # dev pipeline reads the dev volume; prod uses the default in bronze_orders.py

  prod:
    mode: production
    workspace:
      host: https://dbc-e20a4581-d807.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: shop
      dbt_schema: prod_shop    # same schemas as the dbt Cloud prod job: prod_shop_staging/_intermediate/_marts
    resources:
      dashboards:
        shop_revenue:
          # parent_path is immutable: keep the bound dashboard (01f1d0816e5311638750cbfb6e64343f) in its existing folder,
          # otherwise the deploy deletes and recreates it with a new ID (links and subscriptions would be lost)
          parent_path: /Workspace/Users/gri9409@gmail.com/shop-pipeline/pipeline/shop-pipeline/dashboards
